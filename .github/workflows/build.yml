name: Build mod

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle 2.14.1 (exigido pelo ForgeGradle 2.1)
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

      - name: Publicar o .jar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: EvolvingWitherStorm-jar
          path: build/libs/*.jar
